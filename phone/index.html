<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TamaPoke</title>
<meta name="description" content="TamaPoke — the ESP32 Pokémon tamagotchi, on your phone.">
<meta name="theme-color" content="#f7efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TamaPoke">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- home: the pet scene (canvas) with its needs and actions -->
  <main id="home" class="view">
    <section id="stage">
      <canvas id="screen" aria-label="TamaPoke"></canvas>
      <header id="hud">
        <div id="streak" hidden>
          <svg viewBox="0 0 16 18" aria-hidden="true"><path d="M8 0 1 18h14z" fill="var(--bad)"/><path d="M8 7 4 18h8z" fill="var(--warn)"/></svg>
          <span></span>
        </div>
        <div id="hud-name"></div>
        <div id="hud-msg"></div>
      </header>
      <div id="banner" hidden><b></b><span></span></div>
      <button id="bigbtn" class="pulse" hidden></button>
      <button id="game-close" class="round-btn" aria-label="Close" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
      </button>
    </section>
    <section id="panel">
      <div id="bars"></div>
      <div id="egginfo" hidden><b id="egg-rarity"></b><span id="egg-dex"></span></div>
      <div id="feedmenu" hidden></div>
      <div id="actions"></div>
    </section>
  </main>

  <section id="dex" class="view" hidden>
    <h1 class="page-title" id="dex-title"></h1>
    <div class="page"><div id="dex-grid"></div></div>
  </section>

  <section id="stats" class="view" hidden>
    <div class="page" id="stats-page"></div>
  </section>

  <section id="settings" class="view" hidden>
    <div class="page" id="settings-page"></div>
  </section>

  <nav id="tabs" role="tablist"></nav>
</div>

<!-- first run: pick a starter -->
<div id="starter" class="fullscreen" hidden>
  <h1 id="starter-title"></h1>
  <div id="starter-list"></div>
</div>

<!-- yes/no questions (release, evolve, farewell) -->
<div id="modal" class="overlay" hidden>
  <div class="sheet">
    <p id="modal-q"></p>
    <button id="modal-a" class="btn"></button>
    <button id="modal-b" class="btn"></button>
  </div>
</div>

<!-- Pokedex entry -->
<div id="dexdetail" class="overlay" hidden>
  <div class="sheet">
    <canvas id="dex-mon" width="200" height="200"></canvas>
    <h2 id="dex-name"></h2>
    <div id="dex-base"></div>
    <div id="dex-box"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
