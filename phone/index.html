<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TamaPoke</title>
<meta name="description" content="TamaPoke — the ESP32 Pokémon tamagotchi, on your phone.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TamaPoke">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  @font-face {
    font-family: "PressStart2P";
    src: url("fonts/PressStart2P-Regular.ttf") format("truetype");
    font-display: block;
  }
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    box-sizing: border-box;
    font-family: "PressStart2P", system-ui, sans-serif;
  }
  #screen {
    /* the device is a 466x466 round AMOLED: keep it round and as big as fits */
    width: min(calc(100vw - 32px), calc(100dvh - 140px), 560px);
    aspect-ratio: 1;
    border-radius: 50%;
    touch-action: none;
    display: block;
    box-shadow: 0 0 0 6px #1b1b25, 0 0 0 10px #e8503a;
  }
  #hints {
    color: #6f7cb8;
    font-size: 9px;
    line-height: 1.9;
    text-align: center;
    max-width: 360px;
  }
</style>
</head>
<body>
  <canvas id="screen" width="466" height="466" aria-label="TamaPoke screen"></canvas>
  <div id="hints">
    ← Pokédex &nbsp;·&nbsp; ↑ stats &nbsp;·&nbsp; ↓ settings<br>
    hold pet 3s: release
  </div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
